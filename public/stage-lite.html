<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>抽奖舞台 · 智学</title>
<style>
  /* 老广告机兼容：不用 CSS 变量、不用 grid，只用最基础属性 */
  html, body { margin: 0; padding: 0; height: 100%; background: #141118; color: #f4ead6;
    font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", Arial, sans-serif; overflow: hidden; }
  #app { position: absolute; left: 0; top: 0; width: 100%; height: 100%; -webkit-transform-origin: 0 0; transform-origin: 0 0; }
  .hero-head { position: absolute; left: 0; right: 0; top: 0; height: 68px; border-bottom: 1px solid #2c261d; }
  .logo { display: block; position: absolute; left: 24px; top: 14px; height: 42px; width: auto; }
  .logo--big { position: static; height: 64px; margin: 0 auto 16px; }
  body.portrait .logo--big { position: static; height: 92px; margin-bottom: 22px; }
  
  .act-name { position: absolute; left: 250px; top: 18px; font-size: 22px; color: #f4ead6; font-weight: bold; line-height: 1.25; }
  .act-sub { display: block; margin-top: 3px; font-size: 13px; letter-spacing: 2px; color: #8c7f6a; font-weight: normal; }
  .quota { position: absolute; right: 26px; top: 16px; text-align: right; }
  .quota b { font-size: 22px; color: #c9a05c; }
  .quota span { font-size: 11px; color: #7d6f58; letter-spacing: 2px; display: block; }

  .stage { position: absolute; left: 0; right: 34%; top: 68px; bottom: 0; }
  .circle { position: absolute; left: 50%; top: 44%; width: 420px; height: 420px; margin-left: -210px; margin-top: -210px;
    border: 2px solid #3a3124; border-radius: 50%; text-align: center; }
  .circle .eyebrow { margin-top: 128px; font-size: 13px; letter-spacing: 8px; color: #7d6f58; }
  .circle .name { margin-top: 18px; font-size: 54px; color: #f4ead6; font-weight: bold; }
  .circle .meta { margin-top: 14px; font-size: 16px; color: #a2957f; }
  .win-img { display: none; width: 280px; height: 280px; margin: 46px auto 4px; border-radius: 16px;
    background-color: #fff; background-repeat: no-repeat; background-position: center; background-size: contain;
    box-shadow: 0 20px 45px -26px rgba(0, 0, 0, 0.85); }
  .circle.win .win-img { display: block; }
  .circle.win .eyebrow { display: none; }
  .circle.win .name { font-size: 44px; margin-top: 12px; }
  body.portrait .win-img { width: 400px; height: 400px; margin: 40px auto 6px; border-radius: 22px; }
  body.portrait .circle.win .name { font-size: 64px; margin-top: 16px; }
  .circle.rolling { border-color: #c9a05c; }
  .circle.rolling .name { color: #e7c27c; }

  .controls { position: absolute; left: 50%; bottom: 26px; width: 560px; margin-left: -280px; text-align: center; }
  .field { margin-bottom: 10px; }
  .field input { width: 100%; height: 56px; box-sizing: border-box; border: 1px solid #3a3124; border-radius: 8px;
    background: #1d1a14; color: #f4ead6; font-size: 26px; text-align: center; letter-spacing: 4px; outline: none; }
  .field input.code { text-transform: uppercase; }
  .field input.err { border-color: #e07a5f; box-shadow: 0 0 0 4px rgba(224, 122, 95, 0.25); }
  .hint { font-size: 13px; color: #7d6f58; min-height: 18px; margin-bottom: 8px; }
  .hint.err { color: #e07a5f; }
  .btn { display: inline-block; width: 100%; height: 64px; line-height: 64px; border: 0; border-radius: 10px;
    background: #a9772f; color: #fff6e2; font-size: 24px; letter-spacing: 6px; cursor: pointer; }
  .btn.stop { background: #9c3b28; }
  /* 开奖后：下一位按钮（拍完照继续抽） */
  .next-row { margin-bottom: 14px; }
  /* 结果态：只留「下一位」，抽奖控件先收起来 */
  .controls.is-result .prize-pick,
  .controls.is-result .field,
  .controls.is-result .hint,
  .controls.is-result #draw-btn { display: none; }
  .next-btn { background: #2a2318; color: #f0d39a; border: 1px solid #c9a05c; font-size: 20px; letter-spacing: 3px; }
  body.portrait .next-btn { font-size: 30px; height: 92px; letter-spacing: 4px; }
  body.portrait .next-row { margin-bottom: 18px; }
  /* 名单抽奖：顶部奖项选择 */
  .prize-pick { display: none; margin-bottom: 14px; text-align: center; }
  body.roster .prize-pick { display: block; }
  body.roster .controls .field { display: none; }
  .chip { display: inline-block; margin: 5px 6px; padding: 10px 18px; border-radius: 999px;
    border: 1px solid #3a3124; background: #1d1a14; color: #a2957f; font-family: inherit; font-size: 18px;
    cursor: pointer; line-height: 1.1; }
  .chip b { font-weight: normal; }
  .chip i { display: block; margin-top: 3px; font-style: normal; font-size: 12px; color: #7d6f58; }
  .chip.on { border-color: #c9a05c; background: #2a2318; color: #f4ead6; }
  .chip.on i { color: #c9a05c; }
  .chip.off { opacity: .35; cursor: default; }
  body.portrait .chip { font-size: 26px; padding: 13px 22px; margin: 6px 7px; }
  body.portrait .chip i { font-size: 17px; }
  .btn[disabled] { opacity: .5; }

  .side { position: absolute; right: 0; top: 68px; bottom: 0; width: 34%; border-left: 1px solid #2c261d; padding: 18px 20px; box-sizing: border-box; }
  .side h3 { margin: 0 0 10px; font-size: 13px; letter-spacing: 4px; color: #7d6f58; font-weight: normal; }
  .prize { border-bottom: 1px solid #241f17; padding: 9px 0; }
  .prize .n { font-size: 16px; color: #f4ead6; }
  .prize .m { font-size: 12px; color: #7d6f58; margin-top: 3px; }
  .prize .r { float: right; font-size: 16px; color: #c9a05c; }
  .feed { margin-top: 18px; }
  .feed-item { font-size: 14px; color: #a2957f; padding: 6px 0; border-bottom: 1px solid #241f17; }

  .login { position: absolute; left: 50%; top: 50%; width: 420px; margin-left: -210px; margin-top: -170px; }
  .login h2 { font-size: 22px; color: #c9a05c; letter-spacing: 4px; margin: 0 0 18px; }
  .login input { width: 100%; height: 52px; box-sizing: border-box; margin-bottom: 12px; border: 1px solid rgba(157, 177, 164, 0.4);
    border-radius: 8px; background: #1d1a14; color: #f4ead6; font-size: 18px; padding: 0 14px; outline: none; }
  .login .btn { height: 56px; line-height: 56px; font-size: 18px; letter-spacing: 4px; }
  .login .tip { font-size: 12px; color: #7d6f58; margin-top: 12px; line-height: 1.7; }
  .login label { display: block; font-size: 12px; color: #7d6f58; margin: -4px 0 12px; }
  .hidden { display: none; }

  .sound-btn { position: absolute; right: 18px; bottom: 12px; z-index: 9; padding: 6px 14px; border-radius: 999px;
    border: 1px solid #3a3124; background: transparent; color: #a2957f; font-size: 13px; letter-spacing: 2px;
    cursor: pointer; font-family: inherit; }
  .sound-btn.off { opacity: .45; }
  .logout-btn { position: absolute; right: 118px; bottom: 12px; z-index: 9; padding: 6px 14px; border-radius: 999px;
    border: 1px solid #3a3124; background: transparent; color: #a2957f; font-size: 13px; letter-spacing: 2px;
    cursor: pointer; font-family: inherit; }
  .logout-btn.confirm { border-color: #e07a5f; color: #e07a5f; }
  /* 抽奖滚动中：藏掉“退出登录 / 返回宣传页”，只留音效 */
  body.rolling .logout-btn,
  body.rolling .back-to-intro { display: none; }

  /* 9:16 竖屏（广告机）：侧栏收起、圆盘放大、控件加宽 */
  body.portrait .side { display: none; }
  body.portrait .stage { right: 0; }
  body.portrait .hero-head { height: 108px; }
  body.portrait .brand { left: 24px; top: 26px; font-size: 26px; }
  body.portrait .brand small { font-size: 12px; }
  body.portrait .act-name { left: 0; right: 0; top: 118px; font-size: 48px; text-align: center; padding: 0 6%; }
  body.portrait .act-sub { font-size: 22px; margin-top: 6px; letter-spacing: 3px; }
  body.portrait .quota { right: 24px; top: 26px; }
  body.portrait .quota b { font-size: 34px; }
  body.portrait .quota span { font-size: 13px; }
  body.portrait .stage { top: 108px; }
  body.portrait .circle { top: 40%; width: 734px; height: 734px; margin-left: -367px; margin-top: -367px; }
  body.portrait .circle .eyebrow { margin-top: 26%; font-size: 16px; }
  body.portrait .circle .name { font-size: 118px; }
  body.portrait .circle .meta { font-size: 24px; }
  body.portrait .controls { width: 86%; left: 7%; margin-left: 0; bottom: 60px; }
  /* 广告机输入法会盖住底部：输入时把整块输入区顶到上方 */
  body.portrait.typing .controls { top: 96px; bottom: auto; }
  body.portrait.typing .circle { opacity: .16; }
  body.portrait.typing .controls .hint { color: #c9a05c; }
  body.portrait.typing .login { top: 30%; }
  body.portrait .field input { height: 84px; font-size: 34px; border-radius: 12px; }
  body.portrait .hint { font-size: 19px; min-height: 26px; }
  body.portrait .btn { height: 96px; line-height: 96px; font-size: 34px; }
  body.portrait .login { width: 84%; left: 8%; margin-left: 0; top: 50%; margin-top: -260px; }
  body.portrait .login h2 { font-size: 34px; }
  body.portrait .login input { height: 84px; font-size: 26px; }
  body.portrait .login .btn { height: 90px; line-height: 90px; font-size: 28px; }
  body.portrait .login label { font-size: 20px; }
  body.portrait .login .tip { font-size: 18px; }
  body.portrait .sound-btn { right: 24px; bottom: 22px; font-size: 17px; padding: 9px 18px; }
  body.portrait .logout-btn { right: 150px; bottom: 22px; font-size: 17px; padding: 9px 18px; }

  /* ---------- 宣传页（待机默认） ---------- */
  #intro { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden;
    background: linear-gradient(160deg, #fdf8ee 0%, #f6ecd9 55%, #efdfc4 100%); color: #2b2117; }
  .intro-head { position: absolute; left: 0; right: 0; top: 0; height: 68px; }
  .intro-head .logo { position: absolute; left: 24px; top: 14px; height: 42px; width: auto; }
  .intro-title { font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Heiti SC", Arial, sans-serif; }
  body.portrait .intro-quota-tip { font-size: 20px; }
  
  .intro-head .quota { right: 26px; top: 12px; }
  .intro-head .quota b { color: #a9772f; }
  .intro-head .quota span { color: #a2957f; }
  .intro-main { position: absolute; left: 5%; right: 5%; top: 76px; bottom: 64px; text-align: center; overflow: hidden; }
  #intro-scale { -webkit-transform-origin: top center; transform-origin: top center; }

  .intro-title { font-size: 64px; color: #A93226; font-weight: 800; line-height: 1.16; letter-spacing: 1px; text-shadow: 0 2px 0 rgba(255, 255, 255, 0.5); }
  .intro-sub { display: none; font-size: 18px; color: #a2957f; letter-spacing: 4px; margin-top: 10px; }
  .intro-hook { margin: 12px auto 0; max-width: 94%; color: #6b4515; font-size: 26px; font-weight: bold;
    line-height: 1.5; letter-spacing: 1px; }
  .intro-rule { width: 86%; height: 1px; margin: 18px auto 0;
    background: linear-gradient(90deg, rgba(169, 119, 47, 0), rgba(169, 119, 47, 0.5), rgba(169, 119, 47, 0)); }
  .intro-prizes { margin-top: 14px; text-align: center; }
  .prize-card { position: relative; display: inline-block; vertical-align: top; width: 22%; margin: 6px 1%;
    height: 190px; box-sizing: border-box; border: 1px solid rgba(169, 119, 47, 0.28); border-radius: 16px; overflow: hidden;
    text-align: left; background: #ffffff; box-shadow: 0 12px 30px -24px rgba(120, 88, 36, 0.6); }
  .prize-card.featured { width: 99%; margin: 8px 0.5%; height: 230px; }
  .prize-card.featured .pc-body { padding: 40px 16px 12px; }
  .prize-card.featured .pc-body .lv { font-size: 14px; }
  .prize-card.featured .pc-body .nm { font-size: 24px; }
  .prize-card.featured .pc-body .rm { font-size: 14px; }
  .prize-card.featured .pc-body .rm b { font-size: 18px; }
  .pc-bg { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background-size: contain; background-repeat: no-repeat;
    background-position: center; }
  .pc-blur { position: absolute; left: -12px; top: -12px; right: -12px; bottom: -12px; background-size: cover;
    background-position: center; background-repeat: no-repeat; background-color: #f3e9d6;
    -webkit-filter: blur(14px) brightness(0.9); filter: blur(14px) brightness(0.9); }
  .pc-bg--empty { background-image: linear-gradient(135deg, #efe3cf, #e2cfa9); background-size: 100% 100%; }
  .pc-body { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 10px 9px; color: #fff;
    background: linear-gradient(to top, rgba(24, 17, 8, 0.82), rgba(24, 17, 8, 0.55) 55%, rgba(24, 17, 8, 0)); }
  .pc-body .lv { font-size: 11px; letter-spacing: 1px; color: #f0d39a; }
  .pc-body .nm { margin-top: 2px; font-size: 15px; font-weight: bold; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pc-body .rm { margin-top: 2px; font-size: 11px; color: #e9ddc6; }
  .pc-body .rm b { color: #ffd98a; font-size: 14px; }

  .prize-more { margin-top: 10px; font-size: 16px; color: #8a7f6d; }
  .prize-card .ph { height: 118px; border-radius: 10px; background: linear-gradient(135deg, #efe3cf, #e2cfa9); }
  body.portrait .prize-card .ph { height: 182px; }
  body.portrait .prize-more { font-size: 20px; }
  .intro-quota-line { margin-top: 16px; font-size: 22px; letter-spacing: 3px; color: #8a7f6d; }
  .intro-quota-line b { font-size: 48px; color: #c0392b; margin: 0 8px; letter-spacing: 0; }
  .intro-quota-line span:last-child { font-size: 24px; color: #6b5a41; }
  .intro-bar { width: 64%; height: 12px; margin: 12px auto 0; border-radius: 999px; background: #e2d5bd; overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(90, 64, 28, 0.18); }
  .intro-bar i { display: block; height: 100%; width: 100%; border-radius: 999px; transition: width .6s ease; }
  #intro-bar-fill.bar-high { background: linear-gradient(90deg, #d9a24a, #b5711f); }
  #intro-bar-fill.bar-mid { background: linear-gradient(90deg, #e2604a, #b23020); }
  #intro-bar-fill.bar-low { background: linear-gradient(90deg, #c0392b, #8f1d12); animation: barPulse 1.5s ease-in-out infinite; }
  @keyframes barPulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  .intro-quota-tip { min-height: 22px; margin-top: 8px; font-size: 17px; letter-spacing: 2px; color: #b23020; }
  .intro-cta { position: static; margin-top: 16px; text-align: center; font-size: 22px;
    letter-spacing: 6px; color: #a9772f; animation: introPulse 1.8s ease-in-out infinite; }
  @keyframes introPulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  body.portrait .intro-head { height: 108px; }
  body.portrait .logo { height: 56px; top: 20px; }
  body.portrait .intro-main { left: 3%; right: 3%; top: 96px; bottom: 74px; }
  body.portrait .intro-title { font-size: 100px; line-height: 1.08; letter-spacing: 3px; max-width: 880px; margin: 0 auto; }
  body.portrait .intro-sub { display: none; }
  body.portrait .intro-hook { font-size: 34px; line-height: 1.45; margin-top: 14px; max-width: 94%; }
  body.portrait .intro-rule { margin-top: 16px; }
  body.portrait .intro-quota-line { font-size: 24px; margin-top: 14px; letter-spacing: 4px; }
  body.portrait .intro-quota-line b { font-size: 62px; margin: 0 10px; }
  body.portrait .intro-quota-line span:last-child { font-size: 28px; }
  body.portrait .intro-bar { height: 18px; margin-top: 16px; width: 72%; }
  body.portrait .prize-card { width: 47%; margin: 7px 1.3%; height: 226px; padding: 0; }
  body.portrait .prize-card.featured { width: 97.4%; margin: 9px 1.3%; height: 268px; }
  body.portrait .prize-card.featured .pc-body { padding: 60px 22px 18px; }
  body.portrait .prize-card.featured .pc-body .lv { font-size: 22px; }
  body.portrait .prize-card.featured .pc-body .nm { font-size: 40px; }
  body.portrait .prize-card.featured .pc-body .rm { font-size: 22px; }
  body.portrait .prize-card.featured .pc-body .rm b { font-size: 30px; }
  body.portrait .pc-body { padding: 40px 16px 14px; }
  body.portrait .pc-body .lv { font-size: 17px; }
  body.portrait .pc-body .nm { font-size: 27px; margin-top: 4px; }
  body.portrait .pc-body .rm { font-size: 17px; margin-top: 4px; }
  body.portrait .pc-body .rm b { font-size: 24px; }
  body.portrait .intro-cta { margin-top: 16px; font-size: 28px; letter-spacing: 4px; }

  .back-to-intro { position: absolute; left: 18px; bottom: 12px; z-index: 9; padding: 6px 14px; border-radius: 999px;
    border: 1px solid #3a3124; background: transparent; color: #a2957f; font-size: 13px; letter-spacing: 2px;
    cursor: pointer; font-family: inherit; }
  body.portrait .back-to-intro { left: 24px; bottom: 22px; font-size: 17px; padding: 9px 18px; }
  /* 前台开关关闭时的整屏提示 */
  .closed-screen { position: fixed; left: 0; top: 0; right: 0; bottom: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px; background: #141118; color: #f4ead6;
    text-align: center; padding: 8%; }
  .closed-title { font-size: 44px; font-weight: bold; letter-spacing: 2px; }
  .closed-note { font-size: 18px; color: #a2957f; line-height: 1.7; max-width: 560px; }
  body.portrait .closed-title { font-size: 76px; }
  body.portrait .closed-note { font-size: 28px; max-width: 82%; }
</style>
</head>
<body>
<div id="app">
  <!-- 登录 -->
  <div id="login" class="login">
    <img class="logo logo--white logo--big" src="/brand/logo-white.svg" alt="智学时光书房" />
    <h2>现场抽奖</h2>
    <input id="acc" type="text" placeholder="账号（手机号）" autocomplete="off" />
    <input id="pwd" type="password" placeholder="密码" />
    <label><input id="remember" type="checkbox" checked style="width:auto;height:auto;vertical-align:middle" /> 这台机器长期登录（30 天免登录）</label>
    <button class="btn" id="login-btn" type="button">进入舞台</button>
    <div class="tip" id="login-tip">用管理员分配的账号登录。如果提示要先改密码，请在电脑上登录后台改掉再来。</div>
  </div>

  <!-- 宣传页（待机默认展示） -->
  <div id="intro" class="hidden">
    <div class="intro-head">
      <img class="logo logo--green" src="/brand/logo-green.svg" alt="智学时光书房" />
      <div class="quota"><b id="intro-quota">—</b><span>本场剩余</span></div>
    </div>
    <div class="intro-main">
      <div id="intro-scale">
        <div class="intro-title" id="intro-title">—</div>
        <div class="intro-sub" id="intro-sub"></div>
        <div class="intro-hook" id="intro-copy"></div>
        <div class="intro-quota-line"><span>剩余名额</span><b id="intro-quota-num">—</b><span id="intro-quota-total">/ —</span></div>
        <div class="intro-bar"><i id="intro-bar-fill"></i></div>
        <div class="intro-quota-tip" id="intro-quota-tip"></div>
        <div class="intro-rule"></div>
        <div class="intro-prizes" id="intro-prizes"></div>
        <div class="intro-cta" id="intro-cta">点击屏幕 · 输入抽奖码开奖</div>
      </div>
    </div>
  </div>

  <!-- 舞台 -->
  <div id="stage" class="hidden">
    <div class="hero-head">
      <img class="logo logo--white" src="/brand/logo-white.svg" alt="智学时光书房" />
      <div class="act-name" id="act-name">—</div>
      <div class="quota"><b id="quota">—</b><span>剩余名额</span></div>
    </div>

    <div class="stage">
      <div class="circle" id="circle">
        <div class="win-img" id="win-img"></div>
        <div class="eyebrow" id="eyebrow">READY TO DRAW</div>
        <div class="name" id="name">等待开奖</div>
        <div class="meta" id="meta">按下「开始抽奖」</div>
      </div>
      <div class="controls">
        <div class="next-row hidden" id="next-row">
          <button class="btn next-btn" id="next-btn" type="button">下一位 · 继续抽奖</button>
        </div>
        <div class="prize-pick" id="prize-pick"></div>
        <div class="field"><input id="code" class="code" type="text" maxlength="14" placeholder="输入 6 位码" autocomplete="off" /></div>
        <div class="field hidden" id="phone-field"><input id="phone" type="text" maxlength="11" placeholder="核对手机号" autocomplete="off" /></div>
        <div class="hint" id="hint">一码一次 · 发码时登记过手机号的需核对手机号</div>
        <button class="btn" id="draw-btn" type="button">开始抽奖</button>
      </div>
    </div>

    <div class="side">
      <h3>奖项池</h3>
      <div id="prizes"></div>
      <h3 class="feed">本场开奖</h3>
      <div id="feed"></div>
    </div>
